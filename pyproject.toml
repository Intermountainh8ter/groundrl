[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundrl"
version = "0.1.0"
description = "Deterministic citation-grounding verifier used as a verifiable reward (RLVR) for small models, with a reward-hacking audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ammon Jackson" }]
dependencies = ["numpy>=1.24"]
keywords = ["rlvr", "grpo", "reward-hacking", "citations", "grounding", "ethereum", "eip"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Heavy training stack. Imported lazily by train/*.py; the core library and the test suite never need it.
train = [
    "torch>=2.4",
    "transformers>=4.56.2",
    "trl>=1.15",
    "peft>=0.13",
    "datasets>=4.7",
    "accelerate>=1.4",
]
vllm = ["vllm>=0.21"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
groundrl = "groundrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["groundrl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
