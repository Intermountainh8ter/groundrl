<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='862' viewBox='0 0 1000 862' font-family='Inter, Helvetica Neue, Arial, sans-serif'>
<rect width='100%' height='100%' fill='#ffffff'/>
<rect x='0' y='0' width='1000' height='7' fill='#1d4ed8'/>
<text x='44.0' y='64.0' font-size='34' font-weight='700' fill='#13161a' text-anchor='start'>groundrl</text>
<text x='44.0' y='90.0' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>If you pay an AI for good answers, can it collect without doing the work?</text>
<line x1='44.0' y1='106.0' x2='956.0' y2='106.0' stroke='#e3e7ec' stroke-width='1.5'/>
<text x='44.0' y='140.0' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>THE QUESTION</text>
<text x='44.0' y='180.4' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>Training an AI means scoring its answers and rewarding high</text>
<text x='44.0' y='210.9' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>scores. If the scoring has a loophole, the AI will find it.</text>
<text x='44.0' y='241.3' font-size='21' font-weight='600' fill='#13161a' text-anchor='start'>How do you check the scoring before you train anything?</text>
<text x='44.0' y='275.3' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHAT WE DID</text>
<text x='44.0' y='308.5' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>We wrote 19 cheating strategies by hand — pad the answer with citations, copy the</text>
<text x='44.0' y='331.7' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>source text back, hedge both ways, state a confident wrong number — and ran all of</text>
<text x='44.0' y='354.9' font-size='16' font-weight='400' fill='#5b6472' text-anchor='start'>them against three versions of the scoring system.</text>
<text x='44.0' y='384.9' font-size='15' font-weight='700' fill='#13161a' text-anchor='start'>How many of the 19 cheats beat each version of the scoring</text>
<text x='266.0' y='437.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>First scoring design</text>
<rect x='280.0' y='421.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='421.9' width='249.2' height='22.0' rx='4' fill='#b91c1c'/>
<text x='820.0' y='437.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>9 cheats won</text>
<text x='266.0' y='471.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Second design</text>
<rect x='280.0' y='455.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='455.9' width='304.5' height='22.0' rx='4' fill='#b91c1c'/>
<text x='820.0' y='471.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>11 cheats won</text>
<text x='266.0' y='505.9' font-size='14' font-weight='400' fill='#13161a' text-anchor='end'>Third design (shipped)</text>
<rect x='280.0' y='489.9' width='526.0' height='22.0' rx='4' fill='#f1f4f8'/>
<rect x='280.0' y='489.9' width='2.0' height='22.0' rx='4' fill='#15803d'/>
<text x='820.0' y='505.9' font-size='14' font-weight='700' fill='#13161a' text-anchor='start'>0 cheats won</text>
<text x='44.0' y='526.9' font-size='12.5' font-weight='400' fill='#5b6472' text-anchor='start'>"Won" means the cheat scored at least half marks — a threshold fixed before any of them were run.</text>
<text x='44.0' y='560.9' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHAT WE FOUND</text>
<text x='44.0' y='598.9' font-size='30' font-weight='700' fill='#1d4ed8' text-anchor='start'>The second attempt was worse than the first.</text>
<text x='44.0' y='628.9' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>Tightening the rules in an obvious way let two more cheats through, not fewer. Only</text>
<text x='44.0' y='652.8' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>the third design closed every hole. The tool also reports which single rule stops</text>
<text x='44.0' y='676.7' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>which cheat, so a reader can see the scoring is held together by specific parts and</text>
<text x='44.0' y='700.6' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>not by luck.</text>
<text x='44.0' y='734.6' font-size='13' font-weight='700' fill='#1d4ed8' letter-spacing='1.6'>WHY IT MATTERS</text>
<text x='44.0' y='768.6' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>Nobody finds a reward loophole by thinking hard about it. You find it by writing the</text>
<text x='44.0' y='792.5' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>cheat yourself and watching it win. This repo does that before spending any money on</text>
<text x='44.0' y='816.4' font-size='16.5' font-weight='400' fill='#13161a' text-anchor='start'>training.</text>
</svg>
